<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Explorer</title>
    <style>
        /* We'll keep CSS minimal for now — focus is on JS concepts */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: #1a202c;
        }

        p.subtitle {
            color: #718096;
            margin-bottom: 32px;
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 32px;
            width: 100%;
            max-width: 500px;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #4299e1;
        }

        button {
            padding: 12px 24px;
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #3182ce;
        }

        button:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }

        #status {
            font-size: 14px;
            color: #718096;
            margin-bottom: 16px;
            min-height: 20px;
            /* prevents layout jump */
        }

        #status.error {
            color: #e53e3e;
        }

        #card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            display: none;
            /* hidden until we have data */
        }

        #card img {
            width: 160px;
            height: 160px;
            display: block;
            margin: 0 auto 16px;
            image-rendering: pixelated;
            /* crisp pixel art */
        }

        #card h2 {
            text-align: center;
            text-transform: capitalize;
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        .types {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .type-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
            color: white;
            background: #718096;
            /* default, JS will override */
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .stat {
            background: #f7fafc;
            border-radius: 8px;
            padding: 10px 12px;
        }

        .stat-name {
            font-size: 11px;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2d3748;
        }
    </style>
</head>

<body>
    <h1>Pokemon Explorer</h1>
    <p class="subtitle">Search any Pokemon by name or ID</p>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="e.g. pikachu, charizard, 25" autocomplete="off" />
        <button id="search-btn">Search</button>
    </div>

    <!-- Status message: loading / error / empty -->
    <div id="status"></div>

    <!-- Pokemon card — hidden until data loads -->
    <div id="card"></div>

    <!-- Our JavaScript file -->
    <script src="app.js"></script>
</body>

</html>
